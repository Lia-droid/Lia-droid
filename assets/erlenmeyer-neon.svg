<svg xmlns="http://www.w3.org/2000/svg"
     width="180"
     height="180"
     viewBox="0 0 180 180">

  <defs>
    <filter id="pinkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="liquidGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="55%" stop-color="#FF2DAA"/>
      <stop offset="100%" stop-color="#C7923E"/>
    </linearGradient>
  </defs>

  <!-- Black background -->
  <rect width="180" height="180" rx="20" fill="#000000"/>

  <!-- Subtle circuit details -->
  <g stroke="#8A2BE2" stroke-width="1.5" opacity="0.35">
    <path d="M15 35h28v18h20"/>
    <path d="M165 42h-25v18h-18"/>
    <path d="M20 145h25v-15h18"/>
    <path d="M160 138h-24v-16h-18"/>
  </g>

  <g fill="#FF2DAA" opacity="0.7">
    <circle cx="15" cy="35" r="2.5"/>
    <circle cx="63" cy="53" r="2.5"/>
    <circle cx="165" cy="42" r="2.5"/>
    <circle cx="122" cy="60" r="2.5"/>
    <circle cx="20" cy="145" r="2.5"/>
    <circle cx="63" cy="130" r="2.5"/>
    <circle cx="160" cy="138" r="2.5"/>
    <circle cx="118" cy="122" r="2.5"/>
  </g>

  <!-- Erlenmeyer outline -->
  <g fill="none"
     stroke="#FF2DAA"
     stroke-width="5"
     stroke-linecap="round"
     stroke-linejoin="round"
     filter="url(#pinkGlow)">

    <path d="M72 24h36"/>
    <path d="M78 24v47L43 137c-6 11 2 20 14 20h66c12 0 20-9 14-20l-35-66V24"/>
  </g>

  <!-- Liquid -->
  <path d="M57 120
           C70 113, 82 126, 94 119
           C106 112, 116 124, 125 118
           L137 140
           C142 149, 134 156, 123 156
           H57
           C46 156, 38 149, 43 140
           Z"
        fill="url(#liquidGradient)"
        opacity="0.85"
        filter="url(#pinkGlow)">

    <animate attributeName="opacity"
             values="0.65;0.95;0.65"
             dur="2.8s"
             repeatCount="indefinite"/>
  </path>

  <!-- Golden bubbles -->
  <g fill="#C7923E" filter="url(#goldGlow)">
    <circle cx="72" cy="123" r="3">
      <animate attributeName="cy"
               values="132;108;132"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="95" cy="136" r="4">
      <animate attributeName="cy"
               values="138;102;138"
               dur="2.4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="112" cy="125" r="2.8">
      <animate attributeName="cy"
               values="130;112;130"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Glass highlights -->
  <g stroke="#F5F5F5"
     stroke-width="2"
     opacity="0.45"
     fill="none">
    <path d="M83 33v35"/>
    <path d="M58 132c8-17 16-31 24-46"/>
  </g>

</svg>
