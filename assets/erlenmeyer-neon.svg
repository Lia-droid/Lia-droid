<svg xmlns="http://www.w3.org/2000/svg"
     width="180"
     height="180"
     viewBox="0 0 180 180"
     role="img"
     aria-labelledby="title description">

  <title id="title">Animated neon Erlenmeyer flask</title>
  <desc id="description">
    A neon laboratory flask with bubbles, changing liquid colors,
    rotating quantum orbits, pulsing light, and flowing data particles.
  </desc>

  <defs>
    <!-- Magenta glow -->
    <filter id="magentaGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Golden glow -->
    <filter id="goldGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Animated liquid gradient -->
    <linearGradient id="liquidGradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%" stop-color="#8A2BE2">
        <animate
          attributeName="stop-color"
          values="#8A2BE2;#FF2DAA;#C7923E;#8A2BE2"
          dur="7s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="55%" stop-color="#FF2DAA">
        <animate
          attributeName="stop-color"
          values="#FF2DAA;#C7923E;#8A2BE2;#FF2DAA"
          dur="7s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#C7923E">
        <animate
          attributeName="stop-color"
          values="#C7923E;#8A2BE2;#FF2DAA;#C7923E"
          dur="7s"
          repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Flask interior clipping area -->
    <clipPath id="flaskClip">
      <path d="
        M78 25
        V70
        L43 137
        C37 148 45 157 57 157
        H123
        C135 157 143 148 137 137
        L102 70
        V25
        Z"/>
    </clipPath>
  </defs>

  <!-- Black laboratory background -->
  <rect
    width="180"
    height="180"
    rx="20"
    fill="#000000"/>

  <!-- Pulsing background halo -->
  <circle
    cx="90"
    cy="101"
    r="64"
    fill="none"
    stroke="#8A2BE2"
    stroke-width="1.5"
    opacity="0.22">

    <animate
      attributeName="r"
      values="58;67;58"
      dur="3.8s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0.12;0.35;0.12"
      dur="3.8s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Circuit paths -->
  <g
    fill="none"
    stroke="#8A2BE2"
    stroke-width="1.3"
    opacity="0.42">

    <path d="M10 38 H38 V53 H57"/>
    <path d="M170 42 H143 V58 H124"/>
    <path d="M13 143 H39 V128 H59"/>
    <path d="M168 140 H142 V123 H121"/>
  </g>

  <!-- Moving data particles -->
  <g fill="#FF2DAA" filter="url(#magentaGlow)">

    <circle r="2.3">
      <animateMotion
        dur="3.2s"
        repeatCount="indefinite"
        path="M10 38 H38 V53 H57"/>
    </circle>

    <circle r="2.3">
      <animateMotion
        dur="4s"
        repeatCount="indefinite"
        path="M170 42 H143 V58 H124"/>
    </circle>

    <circle r="2.3">
      <animateMotion
        dur="3.6s"
        repeatCount="indefinite"
        path="M13 143 H39 V128 H59"/>
    </circle>

    <circle r="2.3">
      <animateMotion
        dur="4.3s"
        repeatCount="indefinite"
        path="M168 140 H142 V123 H121"/>
    </circle>
  </g>

  <!-- Flask neck and outline -->
  <g
    fill="none"
    stroke="#FF2DAA"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#magentaGlow)">

    <animate
      attributeName="opacity"
      values="0.72;1;0.72"
      dur="2.8s"
      repeatCount="indefinite"/>

    <path d="M72 24 H108"/>
    <path d="
      M78 24
      V70
      L43 137
      C37 148 45 157 57 157
      H123
      C135 157 143 148 137 137
      L102 70
      V24"/>
  </g>

  <!-- Liquid inside flask -->
  <g clip-path="url(#flaskClip)">

    <path
      d="
        M38 120
        C55 111 69 128 85 119
        C101 110 116 126 143 116
        V165
        H38
        Z"
      fill="url(#liquidGradient)"
      opacity="0.88"
      filter="url(#magentaGlow)">

      <animate
        attributeName="d"
        dur="4.5s"
        repeatCount="indefinite"
        values="
          M38 120 C55 111 69 128 85 119 C101 110 116 126 143 116 V165 H38 Z;
          M38 116 C55 128 69 110 85 121 C101 130 116 111 143 121 V165 H38 Z;
          M38 120 C55 111 69 128 85 119 C101 110 116 126 143 116 V165 H38 Z"/>
    </path>

    <!-- Rising bubbles -->
    <g fill="#F8D36A" filter="url(#goldGlow)">

      <circle cx="68" cy="146" r="3">
        <animate
          attributeName="cy"
          values="150;106;150"
          dur="3s"
          repeatCount="indefinite"/>
        <animate
          attributeName="opacity"
          values="0;1;0"
          dur="3s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="91" cy="151" r="4">
        <animate
          attributeName="cy"
          values="153;96;153"
          dur="3.7s"
          begin="0.7s"
          repeatCount="indefinite"/>
        <animate
          attributeName="opacity"
          values="0;1;0"
          dur="3.7s"
          begin="0.7s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="112" cy="143" r="2.5">
        <animate
          attributeName="cy"
          values="146;109;146"
          dur="2.6s"
          begin="1.1s"
          repeatCount="indefinite"/>
        <animate
          attributeName="opacity"
          values="0;1;0"
          dur="2.6s"
          begin="1.1s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="80" cy="139" r="2">
        <animate
          attributeName="cy"
          values="142;116;142"
          dur="2.2s"
          begin="1.5s"
          repeatCount="indefinite"/>
        <animate
          attributeName="opacity"
          values="0;0.9;0"
          dur="2.2s"
          begin="1.5s"
          repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Rotating quantum molecule -->
    <g transform="translate(90 118)">

      <g
        fill="none"
        stroke="#F5F5F5"
        stroke-width="1.4"
        opacity="0.75">

        <ellipse rx="24" ry="8"/>
        <ellipse rx="24" ry="8" transform="rotate(60)"/>
        <ellipse rx="24" ry="8" transform="rotate(120)"/>
      </g>

      <g>
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="6s"
          repeatCount="indefinite"/>

        <circle cx="24" cy="0" r="3" fill="#FF2DAA" filter="url(#magentaGlow)"/>
        <circle cx="-12" cy="20" r="3" fill="#C7923E" filter="url(#goldGlow)"/>
        <circle cx="-12" cy="-20" r="3" fill="#8A2BE2" filter="url(#magentaGlow)"/>
      </g>

      <circle
        cx="0"
        cy="0"
        r="5"
        fill="#F5F5F5"
        filter="url(#goldGlow)">

        <animate
          attributeName="r"
          values="4;6;4"
          dur="2s"
          repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Tiny data points -->
    <g fill="#FFFFFF" opacity="0.7">

      <circle cx="58" cy="130" r="1.2">
        <animate
          attributeName="cx"
          values="55;72;55"
          dur="3.4s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="119" cy="133" r="1.2">
        <animate
          attributeName="cx"
          values="122;106;122"
          dur="3.1s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="72" cy="151" r="1">
        <animate
          attributeName="cy"
          values="151;125;151"
          dur="3.8s"
          repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Glass highlights -->
  <g
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2"
    opacity="0.4">

    <path d="M84 33 V66"/>
    <path d="M57 133 C64 116 73 99 82 84"/>
  </g>

  <!-- Base pulse -->
  <ellipse
    cx="90"
    cy="160"
    rx="42"
    ry="5"
    fill="#FF2DAA"
    opacity="0.18"
    filter="url(#magentaGlow)">

    <animate
      attributeName="rx"
      values="34;47;34"
      dur="2.8s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0.1;0.38;0.1"
      dur="2.8s"
      repeatCount="indefinite"/>
  </ellipse>

</svg>
